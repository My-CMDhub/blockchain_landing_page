# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Integration 

on:
  push: # This is the event that triggers the workflow
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest # This is the operating system of the runner

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4 # This is the action that checks out to current branch (feature branch)
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4 # This is the action that sets up the node.js environment
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm i       # install all dependences
    - name: Build the source code
      run: npm run build # build the source code
      
  unit-test:

    runs-on: ubuntu-latest # This is the operating system of the runner

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4 # This is the action that checks out to current branch (feature branch)
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4 # This is the action that sets up the node.js environment
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm i       # install all dependences

    - name: Running Test Case
      run: npm run test # run the test cases
